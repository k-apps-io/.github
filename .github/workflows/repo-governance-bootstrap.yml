name: Repo Governance Bootstrap

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, report-only mode without mutating labels."
        required: true
        type: boolean
        default: true
      repos:
        description: "Optional comma-separated owner/name repos. Empty uses org auto-discovery."
        required: false
        type: string
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  bootstrap:
    name: Auto-discover repos and apply governance labels
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ORG_LABEL_SYNC_TOKEN != '' && secrets.ORG_LABEL_SYNC_TOKEN || github.token }}
      AUTO_DISCOVER_REPOS: "true"
      ORG_NAME: k-apps-io
      ORG_REPO_LIMIT: "200"
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
      REPOS_OVERRIDE: ${{ inputs.repos }}
      CATALOG_PATH: .github/labels/catalog.json
      REPORT_PATH: artifacts/repo-governance-bootstrap-report.md
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tooling
        run: |
          command -v gh
          command -v jq

      - name: Sync governance labels
        run: .github/scripts/label-sync.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-governance-bootstrap-report-${{ github.run_id }}
          path: artifacts/repo-governance-bootstrap-report.md
          if-no-files-found: error

      - name: Publish summary
        if: always()
        run: cat artifacts/repo-governance-bootstrap-report.md >> "$GITHUB_STEP_SUMMARY"
