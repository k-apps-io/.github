name: Ruleset Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate policy and reconciliation
        run: |
          python3 .github/scripts/ruleset-sync.py --validate-only
          python3 -m unittest discover -s .github/scripts/tests -v
