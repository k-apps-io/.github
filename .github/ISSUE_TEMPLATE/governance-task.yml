name: Governance task
description: Create or update organization governance standards or automation
title: "[Governance] "
labels:
  - type/ops
  - status/backlog
  - work/governance
body:
  - type: markdown
    attributes:
      value: |
        Use this template for governance standards and process updates.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line statement of the change.
      placeholder: Define/update the governance change.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / context
      description: What problem is this solving and why now?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope and explicitly out of scope?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List concrete, testable acceptance criteria.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and rollback
      description: What can go wrong and how can this be rolled back?
    validations:
      required: true
