[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kapps-governance"
version = "0.1.0"
description = "Configuration-driven GitHub governance automation for K-Apps"
requires-python = ">=3.11"
dependencies = ["githubkit==0.17.1"]

[project.scripts]
governance = "kapps_governance.cli:main"

[dependency-groups]
dev = ["ruff>=0.14,<1", "mypy>=1.18,<2"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
